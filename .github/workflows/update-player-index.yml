name: Update CS2 player search index

on:
  workflow_dispatch:
  schedule:
    - cron: "32 6 * * 1"
  push:
    paths:
      - "collect_player_index.py"
      - ".github/workflows/update-player-index.yml"

permissions:
  contents: write

concurrency:
  group: player-search-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal CS2 name/ID index (bounded requests)
        run: python3 collect_player_index.py
      - name: Publish name index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bo3_players.json
          if git diff --staged --quiet; then
            echo "No index changes"
          else
            git commit -m "Refresh CS2 player search index (identity only)"
            git push
          fi

name: Headshot Lab

on:
  workflow_dispatch:
  push:
    paths:
      - "headshot_lab.py"
      - "index.html"
      - "data/board_snapshot.json"
      - "tests/**"
      - ".github/workflows/headshot-lab.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Test Headshot Lab calculations
        run: python3 -m unittest discover -s tests -v

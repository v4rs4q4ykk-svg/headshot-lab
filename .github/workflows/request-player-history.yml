name: Research and refresh CS2 players
on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research_pipeline.py"
      - "request_history_issue.py"
      - ".github/workflows/request-player-history.yml"
permissions:
  issues: read
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/bo3
          key: cs2-public-v1-${{ github.run_id }}
          restore-keys: cs2-public-v1-
      - name: Research requested player
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python3 request_history_issue.py
      - name: Refresh saved players
        if: github.event_name != 'issues'
        run: python3 research_pipeline.py --refresh
      - name: Publish collected results
        run: python3 publish_research.py

name: Research requested CS2 player

on:
  issues:
    types: [opened]
  push:
    paths:
      - ".github/workflows/request-player-history.yml"

permissions:
  issues: read
  contents: write

jobs:
  research:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate issue
        id: request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python3 request_history_issue.py
      - name: Research player
        env:
          PLAYER_ID: ${{ steps.request.outputs.id }}
          PLAYER_NAME: ${{ steps.request.outputs.nickname }}
        run: python3 fetch_player_history.py --id "$PLAYER_ID" --name "$PLAYER_NAME"
      - name: Publish one requested player
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player_histories/
          if git diff --cached --quiet; then
            echo "No new research data"
          else
            git commit -m "Add one requested CS2 research record"
            git pull --rebase origin main
            git push
          fi

name: Publish historical CS2 sample

on:
  workflow_dispatch:
  push:
    paths:
      - "collect_archive.py"
      - "replay_dataset.py"
      - "headshot_lab.py"
      - ".github/workflows/publish-historical-sample.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Collect a bounded, historical research sample
        run: python3 collect_archive.py
      - name: Save verified sample in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if git diff --staged --quiet; then
            echo "Historical archive unchanged"
          else
            git commit -m "Update verified historical CS2 sample (NOT live)"
            git push
          fi
